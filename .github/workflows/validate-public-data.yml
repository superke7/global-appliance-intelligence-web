name: Validate public data contract

on:
  push:
    branches: [main]
    paths:
      - "public-batches/**"
      - "config/**"
      - "publishing/**"
  pull_request:
    paths:
      - "public-batches/**"
      - "config/**"
      - "publishing/**"
      - ".github/workflows/validate-public-data.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
      - name: Compile public-only validators
        run: python3 -m py_compile publishing/*.py
      - name: Check pre-publication create, append and privacy barriers
        run: python3 -m publishing.test_preflight_public_batch
      - name: Verify news label taxonomy and synonyms
        run: python3 -m publishing.test_news_taxonomy
      - name: Audit approved historical news tag mappings
        run: python3 -m publishing.validate_news_labels
      - name: Validate historical public batches
        run: python3 publishing/validate_repository.py
      - name: Build all Pages including news tag browser
        run: python3 scripts/build-pages.py
      - name: Check five-field label display, filter behavior contract and safe JSON fields
        run: python3 -m publishing.test_news_browser
      - name: Verify public event registry reproducibility in PRs
        if: github.event_name == 'pull_request'
        run: |
          python3 publishing/rebuild_public_event_registry.py
          git diff --exit-code -- config/public-event-registry.json
      - name: Confirm registry derivation is valid on direct public data pushes
        if: github.event_name == 'push'
        run: python3 publishing/rebuild_public_event_registry.py
