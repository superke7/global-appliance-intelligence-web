name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public-batches/**"
      - "scripts/build-pages.py"
      - "publishing/validate_public_batch.py"
      - "publishing/validate_repository.py"
      - "config/public-batch-contract.json"
      - "config/news-labels/**"
      - "config/news-taxonomy.json"
      - "config/news-geo-hierarchy.json"
      - "publishing/news_taxonomy.py"
      - ".github/workflows/deploy-pages.yml"
  # Daily Beijing 07:50 snapshot: the existing builder emits zero RSS items if no current-day batch.
  # GitHub Actions uses UTC; 23:50 UTC = 07:50 Beijing the following day.
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate builder
        run: python -m py_compile scripts/build-pages.py

      - name: Check all published batches before building Pages and RSS
        run: python3 publishing/validate_repository.py

      - name: Build static site
        run: python scripts/build-pages.py

      - name: Validate approved Sheet label archive before publishing
        run: python3 -m publishing.validate_news_labels

      - name: Smoke test output
        run: |
          test -f _site/index.html
          test -f _site/archive.html
          test -f _site/news.html
          test -f _site/events.html
          test -f _site/rss.xml
          test -f _site/data/latest.json
          grep -q "全球家电AI早报" _site/index.html
          python - <<'PY'
          import email.utils
          import xml.etree.ElementTree as ET

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "content": "http://purl.org/rss/1.0/modules/content/",
              "dc": "http://purl.org/dc/elements/1.1/",
              "sy": "http://purl.org/rss/1.0/modules/syndication/",
          }
          root = ET.parse("_site/rss.xml").getroot()
          channel = root.find("channel")
          assert channel is not None, "RSS channel missing"
          assert channel.find("atom:link", ns) is not None, "RSS atom:self link missing"
          assert channel.findtext("language") == "zh-CN", "RSS language mismatch"
          assert channel.findtext("lastBuildDate"), "RSS lastBuildDate missing"
          assert channel.findtext("sy:updatePeriod", namespaces=ns) == "hourly"
          assert channel.findtext("sy:updateFrequency", namespaces=ns) == "1"

          items = channel.findall("item")
          assert len(items) <= 300, f"RSS item cap exceeded: {len(items)}"
          pub_times = []
          for item in items:
              pub = item.findtext("pubDate")
              assert pub, "RSS item missing pubDate"
              dt = email.utils.parsedate_to_datetime(pub)
              assert dt.utcoffset().total_seconds() == 0, f"pubDate must be UTC: {pub}"
              pub_times.append(dt)

              guid = item.find("guid")
              assert guid is not None and guid.text, "RSS item missing guid"
              assert guid.attrib.get("isPermaLink") == "false", "RSS guid semantics mismatch"
              assert item.find("dc:creator", ns) is not None, "RSS dc:creator missing"
              assert item.find("content:encoded", ns) is not None, "RSS content:encoded missing"
              assert item.find("description") is not None, "RSS description missing"
              assert item.find("category") is not None, "RSS category missing"

          assert pub_times == sorted(pub_times, reverse=True), "RSS items are not newest-first"
          print(f"WordPress-compatible RSS smoke test OK: {len(items)} items")

          # Exercise the actual RSS builder without publishing test articles.
          import importlib.util
          from datetime import datetime, timedelta, timezone
          spec = importlib.util.spec_from_file_location("gai_test_builder", "scripts/build-pages.py")
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          now_bjt = datetime.now(timezone(timedelta(hours=8)))
          today_key = now_bjt.strftime("%Y%m%d")
          yesterday_key = (now_bjt - timedelta(days=1)).strftime("%Y%m%d")
          old_item = {
              "public_id": f"gai-{today_key}-999",
              "title": "历史补录模拟新闻",
              "source_published_date": "2026-01-01",
              "source_name": "模拟来源",
              "source_url": "https://example.com/story",
              "excerpt": "用于RSS规则检查",
              "content_html": "<p>历史新闻正文</p>",
          }
          def rss_entries(test_batches):
              return ET.fromstring(builder.build_rss(test_batches)).findall("./channel/item")

          assert not rss_entries([(yesterday_key, {"items": [old_item]})]), "Yesterday-only RSS must be empty"
          assert not rss_entries([
              (yesterday_key, {"items": [old_item]}),
              (today_key, {"items": []}),
          ]), "Today's approved zero-news batch must produce empty RSS"
          backfill = rss_entries([
              (yesterday_key, {"items": []}),
              (today_key, {"items": [old_item]}),
          ])
          assert len(backfill) == 1, "Historical backfill must enter today's RSS batch"
          assert backfill[0].findtext("guid") == old_item["public_id"], "Historical backfill ID mismatch"
          assert "历史新闻正文" in backfill[0].findtext("content:encoded", namespaces=ns), "RSS full article missing"
          print("RSS regression checks OK: yesterday-only empty; zero-news empty; same-day historical backfill")
          PY

      - name: Verify rendered news label filters
        run: python3 -m publishing.test_news_browser

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
