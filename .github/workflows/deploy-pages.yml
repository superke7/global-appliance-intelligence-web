name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public-batches/**"
      - "scripts/build-pages.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  schedule:
    # 08:30 Beijing time (UTC+8, no DST): atomically switch the public RSS daily batch.
    - cron: "30 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate builder
        run: python -m py_compile scripts/build-pages.py

      - name: Build static site
        run: python scripts/build-pages.py

      - name: Smoke test output
        run: |
          test -f _site/index.html
          test -f _site/archive.html
          test -f _site/events.html
          test -f _site/rss.xml
          test -f _site/data/latest.json
          grep -q "全球家电AI早报" _site/index.html
          python - <<'PY'
          import email.utils
          import xml.etree.ElementTree as ET

          root = ET.parse("_site/rss.xml").getroot()
          items = root.findall("./channel/item")
          assert len(items) <= 300, f"RSS item cap exceeded: {len(items)}"
          for item in items:
              pub = item.findtext("pubDate")
              assert pub, "RSS item missing pubDate"
              email.utils.parsedate_to_datetime(pub)
              guid = item.find("guid")
              assert guid is not None and guid.text, "RSS item missing guid"
          print(f"RSS smoke test OK: {len(items)} items")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
